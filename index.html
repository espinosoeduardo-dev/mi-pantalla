<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Pantalla</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
<style>
  /* ====== CONFIGURA AQUÍ TUS COLORES ====== */
  :root {
    --c1: #0f2027;   /* color de fondo 1 */
    --c2: #203a43;   /* color de fondo 2 */
    --c3: #3ddc97;   /* color acento */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; cursor: none; }
  body { font-family: "Inter", system-ui, sans-serif; color: #fff; }

  /* Fondo animado: manchas de color que se mueven lento */
  .fondo { position: fixed; inset: 0; background: linear-gradient(135deg, var(--c1), var(--c2)); }
  .mancha {
    position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%;
    filter: blur(90px); opacity: .55; mix-blend-mode: screen;
    animation: flotar 40s ease-in-out infinite alternate;
  }
  .m1 { background: var(--c3); top: -20%; left: -10%; }
  .m2 { background: #5b6cff; bottom: -25%; right: -15%; animation-duration: 55s; }
  .m3 { background: #ff7ab6; top: 30%; left: 40%; width: 40vmax; height: 40vmax; animation-duration: 70s; opacity: .35; }
  @keyframes flotar {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(15vw, 10vh) scale(1.2); }
    100% { transform: translate(-10vw, 20vh) scale(.9); }
  }

  /* Contenido (se mueve unos pixeles cada minuto para cuidar la pantalla) */
  .pantalla { position: relative; height: 100%; display: flex; flex-direction: column;
    justify-content: center; padding: 0 8vw; transition: transform 3s ease; }

  /* MODO RELOJ */
  .hora { font-size: 22vw; font-weight: 200; line-height: .9; letter-spacing: -.04em; }
  .fecha { font-size: 3.2vw; font-weight: 400; opacity: .85; margin-top: 1vw; text-transform: capitalize; }
  .clima { display: flex; align-items: center; gap: 1.5vw; margin-top: 3vw; font-size: 3vw; }
  .clima .temp { font-weight: 600; }
  .clima .desc { opacity: .75; }

  /* MODO CUADRO */
  .cuadro { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; }
  .cuadro img { max-width: 80vw; max-height: 80vh; border: 1.5vw solid #f4f1ea;
    box-shadow: 0 3vw 6vw rgba(0,0,0,.6); animation: aparecer 4s ease; }
  .cuadro .pie { position: absolute; bottom: 4vh; font-size: 1.4vw; opacity: .6; letter-spacing: .2em; }
  @keyframes aparecer { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }

  body.modo-cuadro .pantalla { display: none; }
  body.modo-cuadro .cuadro { display: flex; }

  .aviso { position: fixed; bottom: 3vh; right: 3vw; font-size: 1.2vw; opacity: 0; transition: opacity 1s; }
  .aviso.ver { opacity: .7; }
</style>
</head>
<body>
  <div class="fondo">
    <div class="mancha m1"></div><div class="mancha m2"></div><div class="mancha m3"></div>
  </div>

  <main class="pantalla" id="pantalla">
    <div class="hora" id="hora">00:00</div>
    <div class="fecha" id="fecha"></div>
    <div class="clima"><span id="icono">⛅</span><span class="temp" id="temp">--°</span><span class="desc" id="desc">Cargando clima…</span></div>
  </main>

  <section class="cuadro" id="cuadro">
    <img id="foto" alt="">
    <div class="pie" id="pie"></div>
  </section>

  <div class="aviso" id="aviso"></div>

<script>
/* ====== CONFIGURA AQUÍ ====== */
const CIUDAD = { nombre: "Mérida", lat: 20.97, lon: -89.62 };
const FOTOS = [               // tus fotos para el modo cuadro (pon archivos en la misma carpeta o links)
  "foto1.jpg",
  "foto2.jpg",
];
const SEGUNDOS_POR_FOTO = 60;  // cada cuánto cambia la foto en modo cuadro

/* ====== RELOJ ====== */
function reloj() {
  const ahora = new Date();
  document.getElementById("hora").textContent =
    ahora.toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit", hour12: false });
  document.getElementById("fecha").textContent =
    ahora.toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" });
}
setInterval(reloj, 1000); reloj();

/* ====== CLIMA (Open-Meteo, gratis y sin clave) ====== */
const CODIGOS = { 0:["☀️","Despejado"],1:["🌤️","Casi despejado"],2:["⛅","Parcialmente nublado"],3:["☁️","Nublado"],
  45:["🌫️","Neblina"],51:["🌦️","Llovizna"],61:["🌧️","Lluvia"],80:["🌦️","Chubascos"],95:["⛈️","Tormenta"] };
async function clima() {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${CIUDAD.lat}&longitude=${CIUDAD.lon}&current=temperature_2m,weather_code&timezone=auto`;
    const { current } = await (await fetch(url)).json();
    const [icono, desc] = CODIGOS[current.weather_code] || ["🌡️", ""];
    document.getElementById("icono").textContent = icono;
    document.getElementById("temp").textContent = Math.round(current.temperature_2m) + "°";
    document.getElementById("desc").textContent = `${desc} · ${CIUDAD.nombre}`;
  } catch { document.getElementById("desc").textContent = "Sin conexión"; }
}
clima(); setInterval(clima, 15 * 60 * 1000);

/* ====== MODO CUADRO ====== */
let fotoActual = 0;
function siguienteFoto() {
  if (!FOTOS.length) return;
  const img = document.getElementById("foto");
  img.style.animation = "none"; img.offsetHeight; img.style.animation = "";
  img.src = FOTOS[fotoActual];
  document.getElementById("pie").textContent = `${fotoActual + 1} / ${FOTOS.length}`;
  fotoActual = (fotoActual + 1) % FOTOS.length;
}
setInterval(() => document.body.classList.contains("modo-cuadro") && siguienteFoto(), SEGUNDOS_POR_FOTO * 1000);

function cambiarModo() {
  document.body.classList.toggle("modo-cuadro");
  if (document.body.classList.contains("modo-cuadro")) siguienteFoto();
  avisar(document.body.classList.contains("modo-cuadro") ? "Modo cuadro" : "Modo reloj");
}

/* ====== QUE NO SE APAGUE LA PANTALLA ====== */
let candado = null;
async function noDormir() {
  try { candado = await navigator.wakeLock.request("screen"); } catch {}
}
document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && noDormir());
noDormir();

/* ====== CUIDAR LA PANTALLA: mover unos pixeles cada minuto ====== */
setInterval(() => {
  const x = Math.round(Math.random() * 30 - 15), y = Math.round(Math.random() * 30 - 15);
  document.getElementById("pantalla").style.transform = `translate(${x}px, ${y}px)`;
}, 60 * 1000);

/* ====== CONTROL: OK/Enter = pantalla completa · flechas = cambiar modo ====== */
function avisar(texto) {
  const a = document.getElementById("aviso");
  a.textContent = texto; a.classList.add("ver");
  clearTimeout(a.t); a.t = setTimeout(() => a.classList.remove("ver"), 2000);
}
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { document.documentElement.requestFullscreen?.(); noDormir(); }
  if (e.key.startsWith("Arrow")) cambiarModo();
});
document.addEventListener("click", () => { document.documentElement.requestFullscreen?.(); noDormir(); });
</script>
</body>
</html>
